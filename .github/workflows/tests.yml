name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php-lint:
    name: php-lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=-1
      # php -l succeeds despite compile-time deprecations, so they are looked for in its output
      - run: |
          find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l 2>&1 | tee lint.log
          if grep -E 'Deprecated|Warning' lint.log; then exit 1; fi

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: phpstan:2.1.33
      # configuration: phpstan.neon
      - run: phpstan analyse --no-progress --error-format=github

  integration:
    name: integration (PHP ${{ matrix.php }}, ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        db:
          - name: MariaDB 10.11
            image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.0
            image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
            health: mysqladmin ping -h127.0.0.1 -uroot -proot --silent
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          # (each image reads its own variables and ignores the other ones)
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: todo
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TODO_URL: http://127.0.0.1:8000
      TODO_MYSQL: mysql -h127.0.0.1 -uroot -proot todo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          # no Xdebug / PCOV (installed by default): PHP warns at startup that they disable JIT
          coverage: none
          # deprecations and warnings go to php-server.log (shown below), and fail the run
          ini-values: error_reporting=-1, log_errors=On
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up database and configuration
        run: |
          mysql -h127.0.0.1 -uroot -proot todo < sql/install.sql
          printf '<?php\n$db_host = "127.0.0.1"; $db_user = "root"; $db_password = "root"; $db_database = "todo";\n$language = "en-US";\n$require_http_auth = false; $require_https = false;\n' > config.php
      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 > php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.php > /dev/null && break; sleep 1; done
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: PHP server log
        if: always()
        run: cat php-server.log
      - name: no PHP deprecations, warnings or notices
        run: |
          if grep -E 'PHP (Deprecated|Warning|Notice)' php-server.log; then exit 1; fi

  apache-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y apache2 apache2-utils
      - run: sudo sh tests/apache-access.sh
