version: 2
updates:
  # after merging an update, run 'npm ci && npm run vendor' and commit vendor/
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # the actions used by the workflows (pinned by commit SHA, the comment names the version)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # the base image of the Dockerfile (pinned by digest: updates come as pull requests)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # only stable releases: Dependabot has no way to skip pre-releases of image tags, and reads
      # e.g. 8.6.0RC7-apache as a new minor version. So only the patch releases of the PHP minor
      # version in use come as pull requests. A new minor version (8.6) is changed by hand, once it
      # is released, along with the PHP versions of tests.yml (and the required checks, see README.md)
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # the database image of compose.yaml (tests.yml and tests/container.sh use the same one:
  # update them along with it)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # stays on the long-term release 10.11 (community support until 16 Feb 2028), only its
      # patch releases: a new major or minor version upgrades the data files in the volume, which
      # cannot be undone. Upgrade to the next long-term release by hand (backup first, README.md)
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
