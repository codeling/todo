version: 2
updates:
  # after merging an update, run 'npm ci && npm run vendor' and commit vendor/
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # the actions used by the workflows (pinned by commit SHA, the comment names the version)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # the base image of the Dockerfile (pinned by digest: updates come as pull requests)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # the database image of compose.yaml (tests.yml and tests/container.sh use the same one:
  # update them along with it)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # stays on the long-term release 10.11 (community support until 16 Feb 2028), only its
      # patch releases: a new major or minor version upgrades the data files in the volume, which
      # cannot be undone. Upgrade to the next long-term release by hand (backup first, README.md)
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
