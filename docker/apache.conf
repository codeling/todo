ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# .htaccess holds the access rules (HTTPS, HTTP authentication, internal files)
<Directory /var/www/html>
    AllowOverride AuthConfig FileInfo Limit
    Options -Indexes
    Require all granted
</Directory>

# Only if TODO_TRUST_FORWARDED_PROTO=true (see docker/entrypoint.sh, README.md): the container can
# only be reached through a proxy which terminates TLS and overwrites X-Forwarded-Proto.
# Then the request counts as HTTPS for .htaccess; the application gets the same setting in config.php.
SetEnvIfExpr "osenv('TODO_TRUST_FORWARDED_PROTO') == 'true' && %{HTTP:X-Forwarded-Proto} == 'https'" HTTPS=on
